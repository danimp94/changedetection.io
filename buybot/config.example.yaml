# Copy to config.yaml and fill in your details. Never commit config.yaml.
product_url: "https://www.nike.com/es/t/air-jordan-1-low-se-zapatillas-hombre-rhSOKGkR/HV4089-201"
sku: null

# Optional: only needed if the storefront requires choosing a size before buying.
size: null

# Persisted Chromium profile; log in once via `buybot login`.
profile_dir: "profiles/default"

# headless: true is fine once the session is logged in.
headless: true

# Browser locale for the checkout (adidas.com needs en-US, Riot ES needs es-ES).
locale: "es-ES"

# safety_mode: stop right before payment and alert you to finish manually.
# Set to false only if you provide payment details below (full automation).
safety_mode: true

# REQUIRED in production: shared secret; changedetection.io must send it as
# X-Buybot-Secret header. `buybot serve` warns if unset. /status requires it too.
# webhook_secret: "change-me"

checkout_timeout_seconds: 60

# Best-effort quantity (default 1). Applied via common qty inputs when present.
quantity: 1

# Equivalent sizes to try in order (generic; empty = exact match only).
# EU/US sneaker example: {"42": ["8.5", "UK 8"], "M": ["Medium"]}
size_aliases: {}

# Alternate regional URLs for the same product (generic; used by `buybot resolve`).
watch_urls: []

# Optional: attach to your own running Chrome instead of the persistent profile,
# e.g. launch Chrome with --remote-debugging-port=9222 and set:
# cdp_url: "http://127.0.0.1:9222"
cdp_url: null

# Legacy: no longer blocks the server; kept for backwards compatibility.
manual_completion_timeout_seconds: 900

shipping:
  full_name: "Your Name"
  email: "you@example.com"
  phone: "+34600000000"
  address_line1: "Calle Falsa 123"
  address_line2: ""
  city: "Madrid"
  postal_code: "28001"
  region: "Madrid"
  country: "España"

# Only used when safety_mode: false
payment:
  card_number: null
  card_holder: null
  expiry_month: null
  expiry_year: null
  cvv: null

# Optional status alerts (Telegram / Discord / generic JSON webhook).
alerts: []
#  - type: telegram
#    url: "https://api.telegram.org/bot<TOKEN>/sendMessage"
#    chat_id: "<CHAT_ID>"
#  - type: discord
#    url: "https://discord.com/api/webhooks/<ID>/<TOKEN>"

# Marker strings used to decide availability from visible page text.
# Conflicting buy+OOS markers yield UNKNOWN (not IN_STOCK) to avoid false buys.
buy_markers:
  - "Comprar ahora"
  - "Comprar ya"
  - "Añadir a la cesta"
  - "Add to cart"
  - "Add to bag"
  - "Add to basket"
  - "Buy now"

out_of_stock_markers:
  - "Sin existencias"
  - "Agotado"
  - "No disponible"
  - "Sold out"
  - "Out of stock"
  - "Próximamente"
  - "Coming soon"
  - "Notify me"
  - "Unavailable"

# If any of these appear, the bot aborts before buying (run `buybot login` first).
login_required_markers:
  - "Inicia sesión para comprar"
  - "Login to buy"
  - "Sign in to buy"

# Override checkout CSS selectors here if the storefront markup changes.
# Generic adidas fallbacks are built in (add-to-bag, size button grid).
selectors: {}
#  buy_now: 'button:has-text("Comprar ya")'
#  checkout: 'button:has-text("Tramitar pedido")'
#  size_buttons: 'button[data-testid*="size" i]'

# NOTE: run the server with a single worker — the single-flight guard is per-process:
#   buybot serve -c buybot/config.yaml --port 5001   # serve uses workers=1 internally
